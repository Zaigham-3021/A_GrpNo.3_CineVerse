<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090B1A"/>
      <stop offset="52%" stop-color="#1B153A"/>
      <stop offset="100%" stop-color="#090B1A"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="32%" r="35%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#090B1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#sky)"/>
  <rect width="600" height="900" fill="url(#moonGlow)"/>
  <!-- Searchlights -->
  <polygon points="90,820 340,120 440,120" fill="url(#beam)"/>
  <polygon points="510,820 180,150 260,150" fill="url(#beam)" opacity="0.7"/>
  <!-- Midnight Skyscrapers -->
  <g fill="#0E1124" stroke="#252B4F" stroke-width="1">
    <rect x="20" y="450" width="85" height="450"/>
    <rect x="115" y="380" width="95" height="520"/>
    <rect x="230" y="490" width="110" height="410"/>
    <rect x="360" y="350" width="105" height="550"/>
    <rect x="480" y="430" width="105" height="470"/>
  </g>
  <!-- Neon City Windows -->
  <g fill="#00D4FF" opacity="0.55">
    <rect x="135" y="410" width="18" height="4"/><rect x="165" y="445" width="22" height="4"/>
    <rect x="385" y="390" width="24" height="4"/><rect x="415" y="425" width="18" height="4"/>
    <rect x="505" y="470" width="20" height="4"/>
  </g>
  <!-- Foreground Rooftop & Tactical Silhouette -->
  <polygon points="0,710 350,650 600,740 600,900 0,900" fill="#070915"/>
  <g transform="translate(295,435)" fill="#05060F" stroke="#00D4FF" stroke-opacity="0.45" stroke-width="1.5">
    <circle cx="0" cy="-78" r="22"/>
    <path d="M-28,-50 C-18,-56 18,-56 28,-50 L44,90 L14,90 L6,230 L-10,230 L-18,90 L-46,90 Z"/>
  </g>
</svg>

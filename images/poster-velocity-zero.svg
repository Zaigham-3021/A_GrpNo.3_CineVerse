<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="nightRoad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090B1A"/>
      <stop offset="55%" stop-color="#171A32"/>
      <stop offset="100%" stop-color="#070814"/>
    </linearGradient>
    <linearGradient id="cyanTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="purpleTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#nightRoad)"/>
  <!-- Horizon Skyline -->
  <g fill="#0D1024">
    <rect x="30" y="290" width="60" height="220"/><rect x="110" y="230" width="70" height="280"/>
    <rect x="210" y="270" width="55" height="240"/><rect x="370" y="210" width="80" height="300"/>
    <rect x="480" y="260" width="75" height="250"/>
  </g>
  <!-- Perspective Highway -->
  <polygon points="240,490 360,490 600,900 0,900" fill="#0B0E20" stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="2"/>
  <line x1="300" y1="490" x2="300" y2="900" stroke="#00D4FF" stroke-dasharray="22 18" stroke-width="3" opacity="0.55"/>
  <!-- Speed Light Trails -->
  <path d="M265,520 Q235,660 120,860" fill="none" stroke="url(#cyanTrail)" stroke-width="10" stroke-linecap="round"/>
  <path d="M335,520 Q365,660 480,860" fill="none" stroke="url(#purpleTrail)" stroke-width="10" stroke-linecap="round"/>
  <!-- Futuristic Hypercar Silhouette -->
  <g transform="translate(300,660)">
    <path d="M-125,35 L-92,-16 L-42,-36 L42,-36 L92,-16 L125,35 L110,55 L-110,55 Z" fill="#12162E" stroke="#00D4FF" stroke-width="2"/>
    <path d="M-68,-12 L-35,-28 L35,-28 L68,-12 Z" fill="#090B1A" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="-106" y="18" width="44" height="8" rx="4" fill="#00D4FF"/>
    <rect x="62" y="18" width="44" height="8" rx="4" fill="#00D4FF"/>
  </g>
</svg>
